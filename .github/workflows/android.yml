name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build App and Add Android
      run: |
        cd BFR-Windows-and-Android/BFR-App
        npm install
        npx cap init --force --name "BFR App" --package-id "com.bfr.app" || true
        npx cap add android
        npx cap copy android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: BFR-Windows-and-Android/BFR-App/android/app/build/outputs/apk/debug/app-debug.apk
